<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="pieceGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="90%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.4" />

  <!-- Nigerian Flag Accent Arc (Top) -->
  <g transform="translate(166, 44)">
    <rect x="0" y="0" width="60" height="12" rx="4" fill="#008751" />
    <rect x="60" y="0" width="60" height="12" rx="2" fill="#ffffff" />
    <rect x="120" y="0" width="60" height="12" rx="4" fill="#008751" />
  </g>

  <!-- Draughts Checker Piece Outer Rim -->
  <circle cx="256" cy="270" r="168" fill="none" stroke="#047857" stroke-width="12" filter="url(#dropShadow)" opacity="0.6" />
  <circle cx="256" cy="265" r="160" fill="url(#pieceGrad)" stroke="#6ee7b7" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Inner Rings of Traditional Draughts Seed -->
  <circle cx="256" cy="265" r="128" fill="none" stroke="#047857" stroke-width="5" stroke-dasharray="10 6" opacity="0.75" />
  <circle cx="256" cy="265" r="102" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.4" />
  <circle cx="256" cy="265" r="88" fill="#064e3b" stroke="#059669" stroke-width="4" />

  <!-- Grandmaster Golden Crown (Oba King) -->
  <g filter="url(#goldGlow)" transform="translate(256, 265)">
    <!-- Crown Base -->
    <path d="M -48,22 L 48,22 L 42,32 L -42,32 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <circle cx="-32" cy="27" r="3.5" fill="#fef08a" />
    <circle cx="0" cy="27" r="4.5" fill="#ffffff" />
    <circle cx="32" cy="27" r="3.5" fill="#fef08a" />
    
    <!-- Crown Spikes -->
    <path d="M -48,18 L -48,-14 L -20,6 L 0,-28 L 20,6 L 48,-14 L 48,18 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5" />
    
    <!-- Crown Jewels on Spikes -->
    <circle cx="-48" cy="-17" r="5" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
    <circle cx="0" cy="-32" r="7" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="48" cy="-17" r="5" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- Subtle Rim Light Reflection -->
  <path d="M 130,200 A 150,150 0 0,1 382,200" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.35" />
</svg>
